# Reproducible CPU recovery run; uses locally authored synthetic sentences.
data:
  processed_dir: data/audio/retrain/processed
  sample_rate: 16000
  custom_vocab: [WATonomous, Reparo, YOLOv11, ROS2, Slurm, Thevenin, Waterloo, LangGraph]
  synthetic:
    out_dir: data/audio/retrain/synth
    train_voices: [af_heart, af_bella, af_nicole, am_michael, am_fenrir, am_puck,
                   bf_emma, bm_george, am_eric, af_sarah]
    heldout_voices: [af_sky, am_adam, bf_isabella, bm_lewis]
    heldout_sentence_fraction: 0.2
    speeds: [0.9, 1.0, 1.1]
    noise_fraction: 0.3
    noise_snr_db: [15, 30]
  common_voice:
    enabled: true
    dataset: fixie-ai/common_voice_17_0
    language: en
    multiplier: 1
model:
  base: openai/whisper-small
  language: en
  task: transcribe
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, v_proj]
training:
  output_dir: runs/asr-retrain-cpu
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 20
  num_train_epochs: 3
  fp16: false
  generation_max_length: 128
  seed: 42
export:
  merged_dir: models/whisper-personal-merged
  ct2_dir: models/whisper-personal-ct2
  quantization: int8
